<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <body>
      <!-- Bagian Header / Menu Atas ala Elsevier -->
<header style="display: flex; justify-content: space-between; align-items: 
  center; padding: 15px 20px; background-color: #ffffff; border-bottom: 1px solid #e0e0e0; 
  font-family: sans-serif;">

     <!-- Wadah Navigasi: Rapat ke Kiri & Tanpa Kotak Putih -->
<div style="display: flex; align-items: center; background-color: transparent; padding: 10px 0px; gap: 10px;">
    
    <!-- Gambar Logo KIR di Ujung Kiri -->
    <img src="Logo KIR.jpg" alt="Logo KIR" style="width: 35px; height: 35px; object-fit: cover; border-radius: 50%;">
    
    <!-- Tulisan KIR -->
    <div style="font-weight: bold; font-size: 18px; color: #1a2670;">
     
    </div>

</div>


     <script>
    function toggleMenu() {
        var menu = document.getElementById("fullMenu");
        if (menu.style.display === "none" || menu.style.display === "") {
            menu.style.display = "block";
        } else {
            menu.style.display = "none";
        }
    }
</script>


        <!-- Tampilan Menu Full Layar (Mulanya Tersembunyi) -->
    <div id="fullMenu" style="display: none; position: fixed; top: 0; left: 0; 
      width: 100%; height: 100%; background-color: #ffffff; z-index: 999; 
      padding: 20px; box-sizing: border-box; font-family: sans-serif;">
        
        <!-- Bar Atas Menu (Tombol Tutup / X) -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e0e0e0; padding-bottom: 15px;">
            <div style="font-weight: bold; font-size: 18px; color: #b13200;">Menu</div>
            <button onclick="toggleMenu()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #333333;">&times;</button>
        </div>

        <!-- Daftar Menu di Dalamnya -->
        <div style="margin-top: 30px;">
            <a href="Data.html" style="display: block; padding: 15px 0; color: #333333; text-decoration: none; font-size: 18px; border-bottom: 1px solid #f0f0f0; font-weight: bold;">Data Tanaman</a>
        </div>
        
    </div>

      <!-- Tombol Garis Tiga di Header -->
    <div onclick="toggleMenu()" style="cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; width: 20px; height: 14px;">
        <span style="display: block; height: 2px; width: 100%; background-color: #333333; border-radius: 2px;"></span>
        <span style="display: block; height: 2px; width: 100%; background-color: #333333; border-radius: 2px;"></span>
        <span style="display: block; height: 2px; width: 100%; background-color: #333333; border-radius: 2px;"></span>
    </div>


  
</header>

      <!-- HERO SECTION DENGAN GAMBAR LATAR BELAKANG -->
<div style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('Pohon Karet.jpg'); background-size: cover; background-position: center; padding: 40px 20px; color: #ffffff; text-align: left;">
    
    <!-- Teks Kecil di Atas Judul -->
    <p style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: #cccccc;">
        PORTAL PUBLIKASI ILMIAH REMAJA SEKOLAH
    </p>

    <!-- Judul Utama yang Besar -->
    <h1 style="font-size: 28px; line-height: 1.2; font-weight: bold; margin-bottom: 15px;">
        Mengembangkan Penelitian.<br>Memberdayakan Pengetahuan.<br>Membentuk Masa Depan.
    </h1>

    <!-- Deskripsi Singkat -->
    <p style="font-size: 14px; line-height: 1.5; color: #e0e0e0; margin-bottom: 25px;">
        Temukan berbagai artikel ilmiah, jurnal penelitian siswa, eksperimen, serta jaringan peneliti muda yang kreatif, inovatif, 
      dan berprestasi di lingkungan sekolah
    </p>

</div>

      </div>
      </div>
    </body>
  </head>
</html>
